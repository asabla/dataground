name: OpenShell credential evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/openshell-credential-evidence.yml"
      - "cmd/dataground-openshell-canary/**"
      - "deploy/openshell/**"
      - "internal/execution/openshell/**"
      - "internal/runtime/codex/**"
      - "internal/security/canary*/**"
      - "scripts/check-openshell*.mjs"
      - ".go-version"
      - ".nvmrc"
      - "go.mod"
      - "go.sum"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/openshell-credential-evidence.yml"
      - "cmd/dataground-openshell-canary/**"
      - "deploy/openshell/**"
      - "internal/execution/openshell/**"
      - "internal/runtime/codex/**"
      - "internal/security/canary*/**"
      - "scripts/check-openshell*.mjs"
      - ".go-version"
      - ".nvmrc"
      - "go.mod"
      - "go.sum"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: openshell-credential-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  credential-non-exposure:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Extract checksum-verified OpenShell CLI
        env:
          OPENSHELL_VERSION: v0.0.86
          OPENSHELL_PACKAGE: openshell_0.0.86-1_amd64.deb
          OPENSHELL_PACKAGE_SHA256: 3e757ca2f1e855d6e3bcc328fbd69e0441a9a6d01dfe14902f525185dd55ada4
        run: |
          release="https://github.com/NVIDIA/OpenShell/releases/download/$OPENSHELL_VERSION"
          package="$RUNNER_TEMP/$OPENSHELL_PACKAGE"
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 3 \
            --max-redirs 5 \
            --proto '=https' \
            --tlsv1.2 \
            "$release/$OPENSHELL_PACKAGE" \
            --output "$package"
          printf '%s  %s\n' "$OPENSHELL_PACKAGE_SHA256" "$package" \
            | sha256sum --check --strict -
          printf 'Verified OpenShell CLI package SHA-256: %s\n' "$OPENSHELL_PACKAGE_SHA256"
          cli_root="$RUNNER_TEMP/openshell-cli"
          install --directory --mode 0700 "$cli_root"
          dpkg-deb --extract "$package" "$cli_root"
          cli="$cli_root/usr/bin/openshell"
          test -x "$cli"
          "$cli" --version | grep --fixed-strings --line-regexp "openshell 0.0.86"
          printf 'OPENSHELL_CLI=%s\n' "$cli" >>"$GITHUB_ENV"

      - name: Produce and verify live evidence
        run: |
          workspace="$RUNNER_TEMP/dataground-openshell-evidence"
          record="$RUNNER_TEMP/openshell-credential-non-exposure-v3.json"
          install --directory --mode 0700 "$workspace"
          go run ./cmd/dataground-openshell-canary \
            --openshell-binary "$OPENSHELL_CLI" \
            --workspace-root "$workspace" >"$record"
          pnpm openshell:credential-evidence:check "$record"
          digest=$(sha256sum "$record" | cut --delimiter ' ' --fields 1)
          printf 'Verified credential evidence SHA-256: `%s`\n' "$digest" >>"$GITHUB_STEP_SUMMARY"

      - name: Require complete resource removal
        if: always()
        run: |
          status=0
          if docker ps --all \
            --filter label=com.docker.compose.project \
            --format '{{.Label "com.docker.compose.project"}}' \
            | grep --quiet '^dg_canary_'; then
            echo "credential evidence gateway container remains"
            status=1
          fi
          if docker volume ls \
            --filter label=com.docker.compose.project \
            --format '{{.Label "com.docker.compose.project"}}' \
            | grep --quiet '^dg_canary_'; then
            echo "credential evidence gateway volume remains"
            status=1
          fi
          workspace="$RUNNER_TEMP/dataground-openshell-evidence"
          if [ -d "$workspace" ] \
            && find "$workspace" -mindepth 1 -maxdepth 1 \
              ! -name .policy -print -quit | grep --quiet .; then
            echo "credential evidence workspace remains"
            status=1
          fi
          if [ -d "$workspace/.policy" ] \
            && find "$workspace/.policy" -mindepth 1 \
              ! -name .dataground-policy-workspace.lock -print -quit | grep --quiet .; then
            echo "credential evidence policy material remains"
            status=1
          fi
          lock="$workspace/.policy/.dataground-policy-workspace.lock"
          if [ -e "$lock" ] && { [ ! -f "$lock" ] || [ "$(stat --format '%a' "$lock")" != 600 ]; }; then
            echo "credential evidence policy lock is unsafe"
            status=1
          fi
          gateway_image=$(node --input-type=module --eval \
            "import profile from './deploy/openshell/development-profile.json' with { type: 'json' }; process.stdout.write(profile.artifacts.gateway)")
          sandbox_image=$(node --input-type=module --eval \
            "import profile from './deploy/openshell/development-profile.json' with { type: 'json' }; process.stdout.write(profile.artifacts.sandbox)")
          for image in "$gateway_image" "$sandbox_image"; do
            if docker ps --all --filter "ancestor=$image" --quiet | grep --quiet .; then
              echo "credential evidence runtime container remains"
              status=1
            fi
          done
          exit "$status"

      - name: Upload verified evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openshell-credential-non-exposure-v3
          path: ${{ runner.temp }}/openshell-credential-non-exposure-v3.json
          if-no-files-found: error
          retention-days: 30
