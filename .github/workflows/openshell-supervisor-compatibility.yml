name: OpenShell supervisor compatibility candidate

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested ARM64 experimental supervisor from main
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/openshell-supervisor-compatibility.yml
      - deploy/openshell/supervisor-compatibility/**
      - deploy/openshell/candidate-publication*
      - deploy/openshell/runtime-conformance/**
      - deploy/openshell/codex-compatibility/rosetta-runtime-*
      - internal/execution/runtimeevidence/**
      - internal/execution/openshell/**
      - internal/security/canary*/**
      - .go-version
      - go.mod
      - go.sum

permissions:
  contents: read

concurrency:
  group: openshell-supervisor-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strict-landlock:
    runs-on: ubuntu-24.04-arm
    outputs:
      artifact_id: ${{ steps.archive.outputs.artifact-id }}
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Reject publication outside the reviewed main branch
        if: inputs.publish && (github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/main' || github.repository != 'asabla/dataground')
        run: exit 1

      - name: Verify candidate publication boundaries
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 deploy/openshell/candidate-publication_test.py

      - name: Build the pinned supervisor and require strict kernel denials
        run: docker build --tag dataground-supervisor-compatibility:ci deploy/openshell/supervisor-compatibility

      - name: Require candidate identity without activating a runtime
        id: supervisor
        run: |
          test "$(docker image inspect --format '{{index .Config.Labels "dataground.dev.supervisor-compatibility-source"}}' dataground-supervisor-compatibility:ci)" = d556748771c41cbbd4e4dd7cd9030c798afe2b7d
          test "$(docker image inspect --format '{{index .Config.Labels "dataground.dev.certification-eligible"}}' dataground-supervisor-compatibility:ci)" = false
          candidate_image=$(docker image inspect --format '{{.Id}}' dataground-supervisor-compatibility:ci)
          printf 'image=%s\n' "$candidate_image" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version

      - name: Extract the pinned ARM64 OpenShell CLI
        id: openshell
        run: |
          package="$RUNNER_TEMP/openshell_0.0.86-1_arm64.deb"
          curl --fail --location --silent --show-error --retry 3 --max-redirs 5 \
            --proto '=https' --tlsv1.2 \
            https://github.com/NVIDIA/OpenShell/releases/download/v0.0.86/openshell_0.0.86-1_arm64.deb --output "$package"
          printf '%s  %s\n' c46feefdd72f7a1fb3e5f43981f8e21b6942086108a249ff22f08a100a750bc2 "$package" | sha256sum --check --strict -
          cli_root="$RUNNER_TEMP/openshell-cli"
          install --directory --mode 0700 "$cli_root"
          dpkg-deb --extract "$package" "$cli_root"
          printf 'cli=%s\n' "$cli_root/usr/bin/openshell" >> "$GITHUB_OUTPUT"

      - name: Acquire the exact published ARM64 Codex candidate
        id: runtime
        run: |
          image=ghcr.io/asabla/dataground-codex-candidate@sha256:9fff9875097a3608fce25e0d401cacc70ad10113237683fe907e45d94e4b24a1
          docker pull "$image"
          candidate_image=$(docker image inspect --format '{{.Id}}' "$image")
          printf 'image=%s\n' "$candidate_image" >> "$GITHUB_OUTPUT"

      - name: Scan the replacement supervisor and strict policy for credential exposure
        env:
          DATAGROUND_TEST_CODEX_COMPATIBILITY_IMAGE: ${{ steps.runtime.outputs.image }}
          DATAGROUND_TEST_SUPERVISOR_COMPATIBILITY_IMAGE: ${{ steps.supervisor.outputs.image }}
          DATAGROUND_TEST_RUNTIME_TOPOLOGY_ROOT: ${{ github.workspace }}
          DATAGROUND_TEST_OPENSHELL_BINARY: ${{ steps.openshell.outputs.cli }}
        run: >-
          go test ./internal/security/canarylauncher
          -run '^TestStrictSupervisorCandidateCredentialNonExposure$'
          -count=1 -timeout=12m -v

      - name: Require native restrictions and artifact export under the strict policy
        env:
          DATAGROUND_TEST_CODEX_COMPATIBILITY_IMAGE: ${{ steps.runtime.outputs.image }}
          DATAGROUND_TEST_SUPERVISOR_COMPATIBILITY_IMAGE: ${{ steps.supervisor.outputs.image }}
          DATAGROUND_TEST_RUNTIME_TOPOLOGY_ROOT: ${{ github.workspace }}
          DATAGROUND_TEST_OPENSHELL_BINARY: ${{ steps.openshell.outputs.cli }}
        run: >-
          go test ./internal/execution/runtimeevidence
          -run '^TestCodexProviderBoundSandboxCompatibility$'
          -count=1 -timeout=10m -v

      - name: Package the exact tested image
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'asabla/dataground' && inputs.publish
        env:
          CANDIDATE_IMAGE: ${{ steps.supervisor.outputs.image }}
          CANDIDATE_ARCH: arm64
        run: |
          python3 deploy/openshell/candidate-publication.py prepare --candidate supervisor \
            --directory "$RUNNER_TEMP/candidate-publication" \
            --image "$CANDIDATE_IMAGE" --architecture "$CANDIDATE_ARCH" \
            --source-commit "$GITHUB_SHA"

      - name: Upload the tested image archive
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'asabla/dataground' && inputs.publish
        id: archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tested-supervisor-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-publication/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish-candidate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'asabla/dataground' && inputs.publish
    needs: strict-landlock
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Download the exact successful build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.strict-landlock.outputs.artifact_id }}
          path: ${{ runner.temp }}/candidate-publication
          merge-multiple: true

      - name: Verify and load the tested image
        env:
          CANDIDATE_ARCH: arm64
        run: |
          python3 deploy/openshell/candidate-publication.py load --candidate supervisor \
            --directory "$RUNNER_TEMP/candidate-publication" \
            --architecture "$CANDIDATE_ARCH" --source-commit "$GITHUB_SHA"

      - name: Publish the exact candidate digest
        id: published
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
          CANDIDATE_ARCH: arm64
        run: |
          # The pinned attestation action reads ~/.docker/config.json directly.
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
          unset REGISTRY_TOKEN
          python3 deploy/openshell/candidate-publication.py publish --candidate supervisor \
            --directory "$RUNNER_TEMP/candidate-publication" \
            --architecture "$CANDIDATE_ARCH" --source-commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Attest the published candidate provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/asabla/dataground-supervisor-candidate
          subject-digest: ${{ steps.published.outputs.digest }}
          push-to-registry: true

      - name: Remove ephemeral registry authentication
        if: always()
        run: docker logout ghcr.io
