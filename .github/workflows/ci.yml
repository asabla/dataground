name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATAGROUND_REQUIRE_TEST_DATABASE: "true"
      DATAGROUND_TEST_DATABASE_URL: postgres://dataground:dataground@127.0.0.1:5432/dataground_test?sslmode=disable

    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_DB: dataground_test
          POSTGRES_PASSWORD: dataground
          POSTGRES_USER: dataground
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataground -d dataground_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install design-system browser
        run: pnpm --filter @dataground/ui exec playwright install --with-deps chromium

      - name: Verify repository
        run: pnpm verify

  rosetta-http-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Check out pinned Rosetta candidate
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: asabla/rosetta
          ref: 320158f1e4a4eea378d82c1527f4a7af5fb9855b
          path: .cache/rosetta
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version

      - name: Build pinned compiler service
        run: |
          test "$(git -C .cache/rosetta rev-parse HEAD)" = '320158f1e4a4eea378d82c1527f4a7af5fb9855b'
          GOTOOLCHAIN=go1.25.12 go -C .cache/rosetta build -o "$RUNNER_TEMP/rosetta-server" ./cmd/rosetta-server

      - name: Verify real compiler contract on loopback
        env:
          DATAGROUND_ROSETTA_CONFORMANCE_ENDPOINT: http://127.0.0.1:18089
        run: |
          ROSETTA_ADDR=127.0.0.1:18089 "$RUNNER_TEMP/rosetta-server" > "$RUNNER_TEMP/rosetta.log" 2>&1 &
          rosetta_pid=$!
          trap 'kill "$rosetta_pid" 2>/dev/null || true; wait "$rosetta_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if curl --silent --fail --max-time 1 --output /dev/null "$DATAGROUND_ROSETTA_CONFORMANCE_ENDPOINT/v1/capabilities"; then
              break
            fi
            kill -0 "$rosetta_pid"
            sleep 0.1
          done
          go test ./internal/policy/rosetta -run 'TestPinnedRosetta' -count=1 -timeout=1m

  openshell-runtime-topology:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version

      - name: Verify isolated gateway identity and teardown
        env:
          DATAGROUND_TEST_RUNTIME_TOPOLOGY_ROOT: ${{ github.workspace }}
        run: >-
          go test ./internal/execution/runtimeevidence
          -run '^TestDockerTopologyLiveIdentityAndCleanup$'
          -count=1 -timeout=6m

  s3-enforcement-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATAGROUND_TEST_DATABASE_URL: postgres://dataground:dataground@127.0.0.1:55432/dataground_conformance?sslmode=disable
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version

      - name: Start disposable conformance backends
        run: docker compose -f deploy/storage/seaweedfs-conformance.yml up --detach

      - name: Wait for disposable backends
        run: |
          readiness_expected="$RUNNER_TEMP/s3-readiness-expected"
          readiness_observed="$RUNNER_TEMP/s3-readiness-observed"
          printf '%s' 'dataground-s3-ready' >"$readiness_expected"
          for attempt in {1..30}; do
            if docker compose -f deploy/storage/seaweedfs-conformance.yml exec -T postgres \
                pg_isready --username dataground --dbname dataground_conformance >/dev/null \
              && curl --fail --max-time 2 --silent --request PUT \
                --upload-file "$readiness_expected" \
                http://127.0.0.1:8333/dataground-conformance/.dataground-readiness \
              && curl --fail --max-time 2 --silent \
                --output "$readiness_observed" \
                http://127.0.0.1:8333/dataground-conformance/.dataground-readiness \
              && cmp --silent "$readiness_expected" "$readiness_observed"; then
              exit 0
            fi
            sleep 1
          done
          docker compose -f deploy/storage/seaweedfs-conformance.yml logs
          exit 1

      - name: Run enforcement-object conformance
        run: >-
          go run ./cmd/dataground-s3-conformance
          --endpoint http://127.0.0.1:8333
          --bucket dataground-conformance
          --addressing-style path
          --run-id 0123456789abcdef0123456789abcdef
          --allow-loopback-http

      - name: Migrate recovery database
        env:
          DATAGROUND_DATABASE_URL: ${{ env.DATAGROUND_TEST_DATABASE_URL }}
        run: go run ./cmd/dataground-migrate up

      - name: Run composed invocation-artifact recovery
        env:
          DATAGROUND_TEST_S3_BUCKET: dataground-conformance
          DATAGROUND_TEST_S3_ENDPOINT: http://127.0.0.1:8333
        run: >-
          go test ./internal/persistence
          -run '^TestInvocationArtifactCatalogIsFencedAtomicAuditedAndReplayable$'
          -count=1

      - name: Prepare retained enforcement object
        run: >-
          go run ./cmd/dataground-enforcement-recovery-conformance
          --phase prepare
          --endpoint http://127.0.0.1:8333
          --bucket dataground-conformance
          --addressing-style path
          --run-id fedcba9876543210fedcba9876543210
          --allow-loopback-http

      - name: Exercise object-store outage
        run: |
          docker compose -f deploy/storage/seaweedfs-conformance.yml stop seaweedfs
          go run ./cmd/dataground-enforcement-recovery-conformance \
            --phase outage \
            --endpoint http://127.0.0.1:8333 \
            --bucket dataground-conformance \
            --addressing-style path \
            --run-id fedcba9876543210fedcba9876543210 \
            --allow-loopback-http

      - name: Recreate storage and restart database boundaries
        run: |
          docker compose -f deploy/storage/seaweedfs-conformance.yml rm --force seaweedfs
          docker compose -f deploy/storage/seaweedfs-conformance.yml up --detach seaweedfs
          docker compose -f deploy/storage/seaweedfs-conformance.yml restart postgres
          readiness_expected="$RUNNER_TEMP/s3-readiness-expected"
          readiness_observed="$RUNNER_TEMP/s3-readiness-observed"
          printf '%s' 'dataground-s3-ready' >"$readiness_expected"
          for attempt in {1..30}; do
            if docker compose -f deploy/storage/seaweedfs-conformance.yml exec -T postgres \
                pg_isready --username dataground --dbname dataground_conformance >/dev/null \
              && curl --fail --max-time 2 --silent --request PUT \
                --upload-file "$readiness_expected" \
                http://127.0.0.1:8333/dataground-conformance/.dataground-readiness \
              && curl --fail --max-time 2 --silent \
                --output "$readiness_observed" \
                http://127.0.0.1:8333/dataground-conformance/.dataground-readiness \
              && cmp --silent "$readiness_expected" "$readiness_observed"; then
              exit 0
            fi
            sleep 1
          done
          docker compose -f deploy/storage/seaweedfs-conformance.yml logs
          exit 1

      - name: Recover PostgreSQL catalog binding concurrently
        run: >-
          go run ./cmd/dataground-enforcement-recovery-conformance
          --phase recover
          --endpoint http://127.0.0.1:8333
          --bucket dataground-conformance
          --addressing-style path
          --run-id fedcba9876543210fedcba9876543210
          --allow-loopback-http

      - name: Prepare ambiguous catalog commit
        run: >-
          go run ./cmd/dataground-enforcement-recovery-conformance
          --phase prepare
          --endpoint http://127.0.0.1:8333
          --bucket dataground-conformance
          --addressing-style path
          --run-id 00112233445566778899aabbccddeeff
          --allow-loopback-http

      - name: Terminate after committed catalog transaction
        run: |
          runner="$RUNNER_TEMP/dataground-enforcement-recovery-conformance"
          stdout="$RUNNER_TEMP/catalog-commit-loss.stdout"
          stderr="$RUNNER_TEMP/catalog-commit-loss.stderr"
          go build -o "$runner" ./cmd/dataground-enforcement-recovery-conformance
          set +e
          "$runner" \
            --phase commit-loss \
            --endpoint http://127.0.0.1:8333 \
            --bucket dataground-conformance \
            --addressing-style path \
            --run-id 00112233445566778899aabbccddeeff \
            --allow-loopback-http >"$stdout" 2>"$stderr"
          status=$?
          set -e
          if [ "$status" -ne 86 ] || [ -s "$stdout" ] || [ -s "$stderr" ]; then
            echo "catalog commit-loss injection failed"
            exit 1
          fi

      - name: Recover ambiguous catalog commit
        run: >-
          "$RUNNER_TEMP/dataground-enforcement-recovery-conformance"
          --phase committed-recover
          --endpoint http://127.0.0.1:8333
          --bucket dataground-conformance
          --addressing-style path
          --run-id 00112233445566778899aabbccddeeff
          --allow-loopback-http

      - name: Prepare commit-connection-loss scope
        run: >-
          "$RUNNER_TEMP/dataground-enforcement-recovery-conformance"
          --phase prepare
          --endpoint http://127.0.0.1:8333
          --bucket dataground-conformance
          --addressing-style path
          --run-id aabbccddeeff00112233445566778899
          --allow-loopback-http

      - name: Lose PostgreSQL commit acknowledgement
        run: >-
          "$RUNNER_TEMP/dataground-enforcement-recovery-conformance"
          --phase commit-connection-loss
          --endpoint http://127.0.0.1:8333
          --bucket dataground-conformance
          --addressing-style path
          --run-id aabbccddeeff00112233445566778899
          --allow-loopback-http

      - name: Observe and recover ambiguous commit
        run: >-
          "$RUNNER_TEMP/dataground-enforcement-recovery-conformance"
          --phase connection-loss-recover
          --endpoint http://127.0.0.1:8333
          --bucket dataground-conformance
          --addressing-style path
          --run-id aabbccddeeff00112233445566778899
          --allow-loopback-http

      - name: Prepare pre-durability connection-loss scope
        run: >-
          "$RUNNER_TEMP/dataground-enforcement-recovery-conformance"
          --phase prepare
          --endpoint http://127.0.0.1:8333
          --bucket dataground-conformance
          --addressing-style path
          --run-id 11223344556677889900aabbccddeeff
          --allow-loopback-http

      - name: Lose PostgreSQL connection before commit durability
        run: >-
          "$RUNNER_TEMP/dataground-enforcement-recovery-conformance"
          --phase pre-commit-connection-loss
          --endpoint http://127.0.0.1:8333
          --bucket dataground-conformance
          --addressing-style path
          --run-id 11223344556677889900aabbccddeeff
          --allow-loopback-http

      - name: Observe rollback and adopt retained object
        run: >-
          "$RUNNER_TEMP/dataground-enforcement-recovery-conformance"
          --phase rolled-back-recover
          --endpoint http://127.0.0.1:8333
          --bucket dataground-conformance
          --addressing-style path
          --run-id 11223344556677889900aabbccddeeff
          --allow-loopback-http

      - name: Stop disposable conformance backends
        if: always()
        run: docker compose -f deploy/storage/seaweedfs-conformance.yml down --volumes

  postgres-failover-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATAGROUND_ROUTED_DATABASE_URL: postgres://dataground:dataground@127.0.0.1:55431/dataground_conformance?sslmode=disable
      DATAGROUND_REJOINED_DATABASE_URL: postgres://dataground:dataground@127.0.0.1:55432/dataground_conformance?sslmode=disable
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version

      - name: Start disposable streaming-replication pair
        run: >-
          docker compose -f deploy/storage/seaweedfs-conformance.yml
          --profile postgres-failover up --detach

      - name: Wait for primary and physical standby
        run: |
          for attempt in {1..30}; do
            primary_ready=$(docker compose -f deploy/storage/seaweedfs-conformance.yml exec -T postgres \
              psql --username dataground --dbname dataground_conformance --tuples-only --no-align \
              --command 'SELECT NOT pg_is_in_recovery()' 2>/dev/null || true)
            standby_ready=$(docker compose -f deploy/storage/seaweedfs-conformance.yml exec -T postgres-standby \
              psql --username dataground --dbname dataground_conformance --tuples-only --no-align \
              --command 'SELECT pg_is_in_recovery()' 2>/dev/null || true)
            if curl --fail --silent http://127.0.0.1:8333/ >/dev/null \
              && [ "$primary_ready" = "t" ] && [ "$standby_ready" = "t" ]; then
              exit 0
            fi
            sleep 1
          done
          docker compose -f deploy/storage/seaweedfs-conformance.yml logs
          exit 1

      - name: Capture initial PostgreSQL promotion generation
        run: |
          generation=$(docker compose -f deploy/storage/seaweedfs-conformance.yml exec -T postgres \
            psql --username dataground --dbname dataground_conformance --tuples-only --no-align \
            --command "SELECT (pg_split_walfile_name(pg_walfile_name(pg_current_wal_lsn()))).timeline_id")
          if [[ ! "$generation" =~ ^[1-9][0-9]*$ ]]; then
            echo "could not establish the initial PostgreSQL promotion generation"
            exit 1
          fi
          printf '%s\n' "$generation" >"$RUNNER_TEMP/postgres-primary-generation"

      - name: Start stable loopback database endpoint
        env:
          DATAGROUND_ROUTER_HEALTH_DATABASE_URL: postgres://dataground_health:dataground-health@127.0.0.1:55431/dataground_conformance?sslmode=disable
        run: |
          router="$RUNNER_TEMP/dataground-postgres-route-conformance"
          workspace="$RUNNER_TEMP/dataground-postgres-route"
          control="$workspace/control.sock"
          state="$workspace/state.json"
          install -d -m 700 "$workspace"
          go build -o "$router" ./cmd/dataground-postgres-route-conformance
          "$router" \
            --mode manage \
            --listen-address 127.0.0.1:55431 \
            --control-socket "$control" \
            --state-file "$state" \
            --primary-target 127.0.0.1:55432 \
            --promoted-target 127.0.0.1:55433 \
            --route primary \
            --promotion-generation "$(cat "$RUNNER_TEMP/postgres-primary-generation")" \
            >"$RUNNER_TEMP/postgres-route-manager.stdout" \
            2>"$RUNNER_TEMP/postgres-route-manager.stderr" &
          printf '%s\n' "$!" >"$RUNNER_TEMP/postgres-route-manager.pid"
          for attempt in {1..30}; do
            state_status=$("$router" --mode state --control-socket "$control" 2>/dev/null || true)
            manager_state=$(cat "$RUNNER_TEMP/postgres-route-manager.stdout")
            if [ "$state_status" = "primary $(cat "$RUNNER_TEMP/postgres-primary-generation")" ] \
              && [ "$manager_state" = "supervisor-ready" ]; then
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/postgres-route-manager.pid")" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          echo "stable database endpoint did not become ready"
          exit 1

      - name: Migrate primary database
        env:
          DATAGROUND_DATABASE_URL: ${{ env.DATAGROUND_ROUTED_DATABASE_URL }}
        run: go run ./cmd/dataground-migrate up

      - name: Prepare failover recovery scope on primary
        env:
          DATAGROUND_TEST_DATABASE_URL: ${{ env.DATAGROUND_ROUTED_DATABASE_URL }}
        run: >-
          go run ./cmd/dataground-enforcement-recovery-conformance
          --phase prepare
          --endpoint http://127.0.0.1:8333
          --bucket dataground-conformance
          --addressing-style path
          --run-id 223344556677889900aabbccddeeff11
          --allow-loopback-http

      - name: Require standby replay through prepared state
        run: |
          target_lsn=$(docker compose -f deploy/storage/seaweedfs-conformance.yml exec -T postgres \
            psql --username dataground --dbname dataground_conformance --tuples-only --no-align \
            --command 'SELECT pg_current_wal_lsn()')
          if [[ ! "$target_lsn" =~ ^[0-9A-F]+/[0-9A-F]+$ ]]; then
            echo "could not establish the primary WAL boundary"
            exit 1
          fi
          for attempt in {1..30}; do
            replayed=$(docker compose -f deploy/storage/seaweedfs-conformance.yml exec -T postgres-standby \
              psql --username dataground --dbname dataground_conformance --tuples-only --no-align \
              --command "SELECT pg_last_wal_replay_lsn() >= '$target_lsn'::pg_lsn" 2>/dev/null || true)
            if [ "$replayed" = "t" ]; then
              exit 0
            fi
            sleep 1
          done
          echo "standby did not replay the prepared primary state"
          exit 1

      - name: Start long-lived pool through stable endpoint
        env:
          DATAGROUND_TEST_DATABASE_URL: ${{ env.DATAGROUND_ROUTED_DATABASE_URL }}
        run: |
          pool_stdout="$RUNNER_TEMP/postgres-pool.stdout"
          pool_stderr="$RUNNER_TEMP/postgres-pool.stderr"
          "$RUNNER_TEMP/dataground-postgres-route-conformance" \
            --mode pool >"$pool_stdout" 2>"$pool_stderr" &
          printf '%s\n' "$!" >"$RUNNER_TEMP/postgres-pool.pid"
          for attempt in {1..45}; do
            if grep --fixed-strings --line-regexp --quiet \
              'pool-primary-ready' "$pool_stdout"; then
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/postgres-pool.pid")" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          echo "long-lived database pool did not establish primary sessions"
          exit 1

      - name: Stop primary and promote standby
        run: |
          docker compose -f deploy/storage/seaweedfs-conformance.yml stop postgres
          if docker compose -f deploy/storage/seaweedfs-conformance.yml exec -T postgres-standby \
            pg_isready --host postgres --port 5432 --username dataground >/dev/null 2>&1; then
            echo "stopped primary remained reachable"
            exit 1
          fi
          if DATAGROUND_TEST_DATABASE_URL="$DATAGROUND_ROUTED_DATABASE_URL" \
            "$RUNNER_TEMP/dataground-postgres-route-conformance" --mode role \
              >/dev/null 2>&1; then
            echo "stable database endpoint remained usable before route change"
            exit 1
          fi
          for attempt in {1..45}; do
            if grep --fixed-strings --line-regexp --quiet \
              'pool-failure-observed' "$RUNNER_TEMP/postgres-pool.stdout"; then
              break
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/postgres-pool.pid")" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if ! grep --fixed-strings --line-regexp --quiet \
            'pool-failure-observed' "$RUNNER_TEMP/postgres-pool.stdout"; then
            echo "long-lived database pool did not observe primary loss"
            exit 1
          fi
          if "$RUNNER_TEMP/dataground-postgres-route-conformance" \
            --mode select \
            --control-socket "$RUNNER_TEMP/dataground-postgres-route/control.sock" \
            --promotion-generation "$(cat "$RUNNER_TEMP/postgres-primary-generation")" \
            >/dev/null 2>&1; then
            echo "stable database endpoint selected a target before promotion"
            exit 1
          fi
          route=$("$RUNNER_TEMP/dataground-postgres-route-conformance" \
            --mode status \
            --control-socket "$RUNNER_TEMP/dataground-postgres-route/control.sock")
          if [ "$route" != "primary" ]; then
            echo "failed health selection changed the stable database route"
            exit 1
          fi
          docker compose -f deploy/storage/seaweedfs-conformance.yml exec -T postgres-standby \
            pg_ctl promote --pgdata /var/lib/postgresql/data/pgdata --wait
          promoted=$(docker compose -f deploy/storage/seaweedfs-conformance.yml exec -T postgres-standby \
            psql --username dataground --dbname dataground_conformance --tuples-only --no-align \
            --command 'SELECT NOT pg_is_in_recovery()')
          if [ "$promoted" != "t" ]; then
            echo "standby promotion was not observed"
            exit 1
          fi
          initial_generation=$(cat "$RUNNER_TEMP/postgres-primary-generation")
          promoted_generation=$(docker compose -f deploy/storage/seaweedfs-conformance.yml \
            exec -T postgres-standby psql --username dataground \
            --dbname dataground_conformance --tuples-only --no-align \
            --command "SELECT (pg_split_walfile_name(pg_walfile_name(pg_current_wal_lsn()))).timeline_id")
          if [[ ! "$promoted_generation" =~ ^[1-9][0-9]*$ ]] \
            || (( promoted_generation <= initial_generation )); then
            echo "promoted standby did not advance the PostgreSQL promotion generation"
            exit 1
          fi
          if "$RUNNER_TEMP/dataground-postgres-route-conformance" \
            --mode select \
            --control-socket "$RUNNER_TEMP/dataground-postgres-route/control.sock" \
            --promotion-generation "$initial_generation" \
            >/dev/null 2>&1; then
            echo "stable database endpoint accepted a stale promotion generation"
            exit 1
          fi
          route=$("$RUNNER_TEMP/dataground-postgres-route-conformance" \
            --mode status \
            --control-socket "$RUNNER_TEMP/dataground-postgres-route/control.sock")
          if [ "$route" != "primary" ]; then
            echo "stale promotion generation changed the stable database route"
            exit 1
          fi
          printf '%s\n' "$promoted_generation" \
            >"$RUNNER_TEMP/postgres-promoted-generation"

      - name: Confirm promoted standby generation and health
        run: |
          router="$RUNNER_TEMP/dataground-postgres-route-conformance"
          control="$RUNNER_TEMP/dataground-postgres-route/control.sock"
          selected=$("$router" \
            --mode select \
            --control-socket "$control" \
            --promotion-generation "$(cat "$RUNNER_TEMP/postgres-promoted-generation")")
          route=$("$router" --mode status --control-socket "$control")
          role=$(DATAGROUND_TEST_DATABASE_URL="$DATAGROUND_ROUTED_DATABASE_URL" \
            "$router" --mode role)
          if [ "$selected" != "promoted" ] || [ "$route" != "promoted" ] \
            || [ "$role" != "writable-primary" ]; then
            echo "stable database endpoint did not select the promoted node"
            exit 1
          fi
          for attempt in {1..45}; do
            if grep --fixed-strings --line-regexp --quiet \
