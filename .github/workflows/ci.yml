name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATAGROUND_REQUIRE_TEST_DATABASE: "true"
      DATAGROUND_TEST_DATABASE_URL: postgres://dataground:dataground@127.0.0.1:5432/dataground_test?sslmode=disable

    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_DB: dataground_test
          POSTGRES_PASSWORD: dataground
          POSTGRES_USER: dataground
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataground -d dataground_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.13.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install design-system browser
        run: pnpm --filter @dataground/ui exec playwright install --with-deps chromium

      - name: Verify repository
        run: pnpm verify
