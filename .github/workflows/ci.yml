name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATAGROUND_REQUIRE_TEST_DATABASE: "true"
      DATAGROUND_TEST_DATABASE_URL: postgres://dataground:dataground@127.0.0.1:5432/dataground_test?sslmode=disable

    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_DB: dataground_test
          POSTGRES_PASSWORD: dataground
          POSTGRES_USER: dataground
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataground -d dataground_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install design-system browser
        run: pnpm --filter @dataground/ui exec playwright install --with-deps chromium

      - name: Verify repository
        run: pnpm verify

  s3-enforcement-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATAGROUND_TEST_DATABASE_URL: postgres://dataground:dataground@127.0.0.1:55432/dataground_conformance?sslmode=disable
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version

      - name: Start disposable conformance backends
        run: docker compose -f deploy/storage/seaweedfs-conformance.yml up --detach

      - name: Wait for disposable backends
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8333/ >/dev/null \
              && docker compose -f deploy/storage/seaweedfs-conformance.yml exec -T postgres \
                pg_isready --username dataground --dbname dataground_conformance >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker compose -f deploy/storage/seaweedfs-conformance.yml logs
          exit 1

      - name: Run enforcement-object conformance
        run: >-
          go run ./cmd/dataground-s3-conformance
          --endpoint http://127.0.0.1:8333
          --bucket dataground-conformance
          --addressing-style path
          --run-id 0123456789abcdef0123456789abcdef
          --allow-loopback-http

      - name: Migrate recovery database
        env:
          DATAGROUND_DATABASE_URL: ${{ env.DATAGROUND_TEST_DATABASE_URL }}
        run: go run ./cmd/dataground-migrate up

      - name: Prepare retained enforcement object
        run: >-
          go run ./cmd/dataground-enforcement-recovery-conformance
          --phase prepare
          --endpoint http://127.0.0.1:8333
          --bucket dataground-conformance
          --addressing-style path
          --run-id fedcba9876543210fedcba9876543210
          --allow-loopback-http

      - name: Exercise object-store outage
        run: |
          docker compose -f deploy/storage/seaweedfs-conformance.yml stop seaweedfs
          go run ./cmd/dataground-enforcement-recovery-conformance \
            --phase outage \
            --endpoint http://127.0.0.1:8333 \
            --bucket dataground-conformance \
            --addressing-style path \
            --run-id fedcba9876543210fedcba9876543210 \
            --allow-loopback-http

      - name: Recreate storage and restart database boundaries
        run: |
          docker compose -f deploy/storage/seaweedfs-conformance.yml rm --force seaweedfs
          docker compose -f deploy/storage/seaweedfs-conformance.yml up --detach seaweedfs
          docker compose -f deploy/storage/seaweedfs-conformance.yml restart postgres
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8333/ >/dev/null \
              && docker compose -f deploy/storage/seaweedfs-conformance.yml exec -T postgres \
                pg_isready --username dataground --dbname dataground_conformance >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker compose -f deploy/storage/seaweedfs-conformance.yml logs
          exit 1

      - name: Recover PostgreSQL catalog binding concurrently
        run: >-
          go run ./cmd/dataground-enforcement-recovery-conformance
          --phase recover
          --endpoint http://127.0.0.1:8333
          --bucket dataground-conformance
          --addressing-style path
          --run-id fedcba9876543210fedcba9876543210
          --allow-loopback-http

      - name: Prepare ambiguous catalog commit
        run: >-
          go run ./cmd/dataground-enforcement-recovery-conformance
          --phase prepare
          --endpoint http://127.0.0.1:8333
          --bucket dataground-conformance
          --addressing-style path
          --run-id 00112233445566778899aabbccddeeff
          --allow-loopback-http

      - name: Terminate after committed catalog transaction
        run: |
          runner="$RUNNER_TEMP/dataground-enforcement-recovery-conformance"
          stdout="$RUNNER_TEMP/catalog-commit-loss.stdout"
          stderr="$RUNNER_TEMP/catalog-commit-loss.stderr"
          go build -o "$runner" ./cmd/dataground-enforcement-recovery-conformance
          set +e
          "$runner" \
            --phase commit-loss \
            --endpoint http://127.0.0.1:8333 \
            --bucket dataground-conformance \
            --addressing-style path \
            --run-id 00112233445566778899aabbccddeeff \
            --allow-loopback-http >"$stdout" 2>"$stderr"
          status=$?
          set -e
          if [ "$status" -ne 86 ] || [ -s "$stdout" ] || [ -s "$stderr" ]; then
            echo "catalog commit-loss injection failed"
            exit 1
          fi

      - name: Recover ambiguous catalog commit
        run: >-
          "$RUNNER_TEMP/dataground-enforcement-recovery-conformance"
          --phase committed-recover
          --endpoint http://127.0.0.1:8333
          --bucket dataground-conformance
          --addressing-style path
          --run-id 00112233445566778899aabbccddeeff
          --allow-loopback-http

      - name: Prepare commit-connection-loss scope
        run: >-
          "$RUNNER_TEMP/dataground-enforcement-recovery-conformance"
          --phase prepare
          --endpoint http://127.0.0.1:8333
          --bucket dataground-conformance
          --addressing-style path
          --run-id aabbccddeeff00112233445566778899
          --allow-loopback-http

      - name: Lose PostgreSQL commit acknowledgement
        run: >-
          "$RUNNER_TEMP/dataground-enforcement-recovery-conformance"
          --phase commit-connection-loss
          --endpoint http://127.0.0.1:8333
          --bucket dataground-conformance
          --addressing-style path
          --run-id aabbccddeeff00112233445566778899
          --allow-loopback-http

      - name: Observe and recover ambiguous commit
        run: >-
          "$RUNNER_TEMP/dataground-enforcement-recovery-conformance"
          --phase connection-loss-recover
          --endpoint http://127.0.0.1:8333
          --bucket dataground-conformance
          --addressing-style path
          --run-id aabbccddeeff00112233445566778899
          --allow-loopback-http

      - name: Prepare pre-durability connection-loss scope
        run: >-
          "$RUNNER_TEMP/dataground-enforcement-recovery-conformance"
          --phase prepare
          --endpoint http://127.0.0.1:8333
          --bucket dataground-conformance
          --addressing-style path
          --run-id 11223344556677889900aabbccddeeff
          --allow-loopback-http

      - name: Lose PostgreSQL connection before commit durability
        run: >-
          "$RUNNER_TEMP/dataground-enforcement-recovery-conformance"
          --phase pre-commit-connection-loss
          --endpoint http://127.0.0.1:8333
          --bucket dataground-conformance
          --addressing-style path
          --run-id 11223344556677889900aabbccddeeff
          --allow-loopback-http

      - name: Observe rollback and adopt retained object
        run: >-
          "$RUNNER_TEMP/dataground-enforcement-recovery-conformance"
          --phase rolled-back-recover
          --endpoint http://127.0.0.1:8333
          --bucket dataground-conformance
          --addressing-style path
          --run-id 11223344556677889900aabbccddeeff
          --allow-loopback-http

      - name: Stop disposable conformance backends
        if: always()
        run: docker compose -f deploy/storage/seaweedfs-conformance.yml down --volumes

  postgres-failover-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATAGROUND_PRIMARY_DATABASE_URL: postgres://dataground:dataground@127.0.0.1:55432/dataground_conformance?sslmode=disable
      DATAGROUND_PROMOTED_DATABASE_URL: postgres://dataground:dataground@127.0.0.1:55433/dataground_conformance?sslmode=disable
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version

      - name: Start disposable streaming-replication pair
        run: >-
          docker compose -f deploy/storage/seaweedfs-conformance.yml
          --profile postgres-failover up --detach

      - name: Wait for primary and physical standby
        run: |
          for attempt in {1..30}; do
            primary_ready=$(docker compose -f deploy/storage/seaweedfs-conformance.yml exec -T postgres \
              psql --username dataground --dbname dataground_conformance --tuples-only --no-align \
              --command 'SELECT NOT pg_is_in_recovery()' 2>/dev/null || true)
            standby_ready=$(docker compose -f deploy/storage/seaweedfs-conformance.yml exec -T postgres-standby \
              psql --username dataground --dbname dataground_conformance --tuples-only --no-align \
              --command 'SELECT pg_is_in_recovery()' 2>/dev/null || true)
            if curl --fail --silent http://127.0.0.1:8333/ >/dev/null \
              && [ "$primary_ready" = "t" ] && [ "$standby_ready" = "t" ]; then
              exit 0
            fi
            sleep 1
          done
          docker compose -f deploy/storage/seaweedfs-conformance.yml logs
          exit 1

      - name: Migrate primary database
        env:
          DATAGROUND_DATABASE_URL: ${{ env.DATAGROUND_PRIMARY_DATABASE_URL }}
        run: go run ./cmd/dataground-migrate up

      - name: Prepare failover recovery scope on primary
        env:
          DATAGROUND_TEST_DATABASE_URL: ${{ env.DATAGROUND_PRIMARY_DATABASE_URL }}
        run: >-
          go run ./cmd/dataground-enforcement-recovery-conformance
          --phase prepare
          --endpoint http://127.0.0.1:8333
          --bucket dataground-conformance
          --addressing-style path
          --run-id 223344556677889900aabbccddeeff11
          --allow-loopback-http

      - name: Require standby replay through prepared state
        run: |
          target_lsn=$(docker compose -f deploy/storage/seaweedfs-conformance.yml exec -T postgres \
            psql --username dataground --dbname dataground_conformance --tuples-only --no-align \
            --command 'SELECT pg_current_wal_lsn()')
          if [[ ! "$target_lsn" =~ ^[0-9A-F]+/[0-9A-F]+$ ]]; then
            echo "could not establish the primary WAL boundary"
            exit 1
          fi
          for attempt in {1..30}; do
            replayed=$(docker compose -f deploy/storage/seaweedfs-conformance.yml exec -T postgres-standby \
              psql --username dataground --dbname dataground_conformance --tuples-only --no-align \
              --command "SELECT pg_last_wal_replay_lsn() >= '$target_lsn'::pg_lsn" 2>/dev/null || true)
            if [ "$replayed" = "t" ]; then
              exit 0
            fi
            sleep 1
          done
          echo "standby did not replay the prepared primary state"
          exit 1

      - name: Stop primary and promote standby
        run: |
          docker compose -f deploy/storage/seaweedfs-conformance.yml stop postgres
          if docker compose -f deploy/storage/seaweedfs-conformance.yml exec -T postgres-standby \
            pg_isready --host postgres --port 5432 --username dataground >/dev/null 2>&1; then
            echo "stopped primary remained reachable"
            exit 1
          fi
          docker compose -f deploy/storage/seaweedfs-conformance.yml exec -T postgres-standby \
            pg_ctl promote --pgdata /var/lib/postgresql/data/pgdata --wait
          promoted=$(docker compose -f deploy/storage/seaweedfs-conformance.yml exec -T postgres-standby \
            psql --username dataground --dbname dataground_conformance --tuples-only --no-align \
            --command 'SELECT NOT pg_is_in_recovery()')
          if [ "$promoted" != "t" ]; then
            echo "standby promotion was not observed"
            exit 1
          fi

      - name: Recover through promoted standby
        env:
          DATAGROUND_TEST_DATABASE_URL: ${{ env.DATAGROUND_PROMOTED_DATABASE_URL }}
        run: >-
          go run ./cmd/dataground-enforcement-recovery-conformance
          --phase failover-recover
          --endpoint http://127.0.0.1:8333
          --bucket dataground-conformance
          --addressing-style path
          --run-id 223344556677889900aabbccddeeff11
          --allow-loopback-http

      - name: Recreate streaming pair for in-flight commit loss
        run: |
          docker compose -f deploy/storage/seaweedfs-conformance.yml \
            --profile postgres-failover down --volumes
          docker compose -f deploy/storage/seaweedfs-conformance.yml \
            --profile postgres-failover up --detach
          for attempt in {1..30}; do
            primary_ready=$(docker compose -f deploy/storage/seaweedfs-conformance.yml exec -T postgres \
              psql --username dataground --dbname dataground_conformance --tuples-only --no-align \
              --command 'SELECT NOT pg_is_in_recovery()' 2>/dev/null || true)
            standby_ready=$(docker compose -f deploy/storage/seaweedfs-conformance.yml exec -T postgres-standby \
              psql --username dataground --dbname dataground_conformance --tuples-only --no-align \
              --command 'SELECT pg_is_in_recovery()' 2>/dev/null || true)
            if curl --fail --silent http://127.0.0.1:8333/ >/dev/null \
              && [ "$primary_ready" = "t" ] && [ "$standby_ready" = "t" ]; then
              exit 0
            fi
            sleep 1
          done
          echo "recreated failover pair did not become ready"
          exit 1

      - name: Prepare in-flight failover scope on primary
        env:
          DATAGROUND_DATABASE_URL: ${{ env.DATAGROUND_PRIMARY_DATABASE_URL }}
          DATAGROUND_TEST_DATABASE_URL: ${{ env.DATAGROUND_PRIMARY_DATABASE_URL }}
        run: |
          go run ./cmd/dataground-migrate up
          go run ./cmd/dataground-enforcement-recovery-conformance \
            --phase prepare \
            --endpoint http://127.0.0.1:8333 \
            --bucket dataground-conformance \
            --addressing-style path \
            --run-id 3344556677889900aabbccddeeff1122 \
            --allow-loopback-http

      - name: Require standby replay through in-flight fixture
        run: |
          target_lsn=$(docker compose -f deploy/storage/seaweedfs-conformance.yml exec -T postgres \
            psql --username dataground --dbname dataground_conformance --tuples-only --no-align \
            --command 'SELECT pg_current_wal_lsn()')
          if [[ ! "$target_lsn" =~ ^[0-9A-F]+/[0-9A-F]+$ ]]; then
            echo "could not establish the in-flight fixture WAL boundary"
            exit 1
          fi
          for attempt in {1..30}; do
            replayed=$(docker compose -f deploy/storage/seaweedfs-conformance.yml exec -T postgres-standby \
              psql --username dataground --dbname dataground_conformance --tuples-only --no-align \
              --command "SELECT pg_last_wal_replay_lsn() >= '$target_lsn'::pg_lsn" 2>/dev/null || true)
            if [ "$replayed" = "t" ]; then
              exit 0
            fi
            sleep 1
          done
          echo "standby did not replay the in-flight fixture"
          exit 1

      - name: Lose primary while catalog commit is in flight
        env:
          DATAGROUND_TEST_DATABASE_URL: ${{ env.DATAGROUND_PRIMARY_DATABASE_URL }}
        run: |
          runner="$RUNNER_TEMP/dataground-enforcement-recovery-conformance"
          signal="$RUNNER_TEMP/in-flight-commit.signal"
          report="$RUNNER_TEMP/in-flight-commit.json"
          stderr="$RUNNER_TEMP/in-flight-commit.stderr"
          go build -o "$runner" ./cmd/dataground-enforcement-recovery-conformance
          mkfifo "$signal"
          "$runner" \
            --phase failover-commit-loss \
            --primary-loss-signal-fd 3 \
            --endpoint http://127.0.0.1:8333 \
            --bucket dataground-conformance \
            --addressing-style path \
            --run-id 3344556677889900aabbccddeeff1122 \
            --allow-loopback-http >"$report" 2>"$stderr" 3>"$signal" &
          runner_pid=$!
          trap 'kill "$runner_pid" 2>/dev/null || true; rm -f "$signal"' EXIT
          state=""
          if ! IFS= read -r -t 30 state <"$signal" || [ "$state" != "commit-forwarded" ]; then
            kill "$runner_pid" 2>/dev/null || true
            wait "$runner_pid" 2>/dev/null || true
            echo "in-flight commit boundary was not reached"
            exit 1
          fi
          docker compose -f deploy/storage/seaweedfs-conformance.yml stop postgres
          set +e
          wait "$runner_pid"
          status=$?
          set -e
          trap - EXIT
          rm -f "$signal"
          if [ "$status" -ne 0 ] || [ -s "$stderr" ] \
            || ! grep --quiet '"phase": "failover-commit-loss"' "$report" \
            || ! grep --quiet '"status": "passed"' "$report"; then
            echo "in-flight primary-loss injection failed"
            exit 1
          fi

      - name: Promote standby after in-flight commit loss
        run: |
          if docker compose -f deploy/storage/seaweedfs-conformance.yml exec -T postgres-standby \
            pg_isready --host postgres --port 5432 --username dataground >/dev/null 2>&1; then
            echo "stopped primary remained reachable"
            exit 1
          fi
          docker compose -f deploy/storage/seaweedfs-conformance.yml exec -T postgres-standby \
            pg_ctl promote --pgdata /var/lib/postgresql/data/pgdata --wait
          promoted=$(docker compose -f deploy/storage/seaweedfs-conformance.yml exec -T postgres-standby \
            psql --username dataground --dbname dataground_conformance --tuples-only --no-align \
            --command 'SELECT NOT pg_is_in_recovery()')
          if [ "$promoted" != "t" ]; then
            echo "standby promotion after in-flight loss was not observed"
            exit 1
          fi

      - name: Recover ambiguous commit through promoted standby
        env:
          DATAGROUND_TEST_DATABASE_URL: ${{ env.DATAGROUND_PROMOTED_DATABASE_URL }}
        run: >-
          "$RUNNER_TEMP/dataground-enforcement-recovery-conformance"
          --phase failover-commit-recover
          --endpoint http://127.0.0.1:8333
          --bucket dataground-conformance
          --addressing-style path
          --run-id 3344556677889900aabbccddeeff1122
          --allow-loopback-http

      - name: Stop disposable failover backends
        if: always()
        run: >-
          docker compose -f deploy/storage/seaweedfs-conformance.yml
          --profile postgres-failover down --volumes
