            || [ "$(cat "$RUNNER_TEMP/postgres-route-manager-replacement.stderr")" != \
              "PostgreSQL route manager failed" ] \
            || [ "$(cat "$state")" != "$state_before" ] \
            || [ "$(stat --format '%d:%i' "$state.lock")" != \
              "$state_ownership_before" ] \
            || [ "$(stat --format '%d:%i' "$state.manager.lock")" != \
              "$manager_ownership_before" ] \
            || [ "$(stat --format '%d:%i' "$state.supervisor.lock")" != \
              "$supervisor_ownership_before" ]; then
            echo "exhausted route manager emitted unexpected lifecycle output"
            exit 1
          fi
          rm --force "$RUNNER_TEMP/postgres-route-manager.pid"
          "$router" \
            --mode manage \
            --listen-address 127.0.0.1:55431 \
            --control-socket "$control" \
            --state-file "$state" \
            --primary-target 127.0.0.1:55432 \
            --promoted-target 127.0.0.1:55433 \
            >"$RUNNER_TEMP/postgres-route-manager-exhaustion-recovery.stdout" \
            2>"$RUNNER_TEMP/postgres-route-manager-exhaustion-recovery.stderr" &
          recovered_manager=$!
          printf '%s\n' "$recovered_manager" >"$RUNNER_TEMP/postgres-route-manager.pid"
          for attempt in {1..30}; do
            recovered=$("$router" --mode state --control-socket "$control" 2>/dev/null || true)
            role=$(DATAGROUND_TEST_DATABASE_URL="$DATAGROUND_ROUTED_DATABASE_URL" \
              "$router" --mode role 2>/dev/null || true)
            recovered_supervisor=$(pgrep --parent "$recovered_manager" || true)
            recovered_child=$(pgrep --parent "$recovered_supervisor" || true)
            if [ "$recovered" = "$expected" ] && [ "$role" = "writable-primary" ] \
              && [[ "$recovered_supervisor" =~ ^[1-9][0-9]*$ ]] \
              && [[ "$recovered_child" =~ ^[1-9][0-9]*$ ]] \
              && [ "$(cat "$RUNNER_TEMP/postgres-route-manager-exhaustion-recovery.stdout")" = \
                "supervisor-ready" ]; then
              break
            fi
            if ! process_alive "$recovered_manager"; then
              break
            fi
            sleep 1
          done
          if [ "$recovered" != "$expected" ] || [ "$role" != "writable-primary" ] \
            || [[ ! "$recovered_supervisor" =~ ^[1-9][0-9]*$ ]] \
            || [[ ! "$recovered_child" =~ ^[1-9][0-9]*$ ]] \
            || [ "$(cat "$state")" != "$state_before" ] \
            || [ "$(cat "$RUNNER_TEMP/postgres-route-manager-exhaustion-recovery.stdout")" != \
              "supervisor-ready" ] \
            || [ -s "$RUNNER_TEMP/postgres-route-manager-exhaustion-recovery.stderr" ] \
            || [ "$(stat --format '%d:%i' "$state.lock")" != \
              "$state_ownership_before" ] \
            || [ "$(stat --format '%d:%i' "$state.manager.lock")" != \
              "$manager_ownership_before" ] \
            || [ "$(stat --format '%d:%i' "$state.supervisor.lock")" != \
              "$supervisor_ownership_before" ] \
            || [ "$(stat --format '%a' "$state.manager.lock")" != "600" ] \
            || [ "$(stat --format '%a' "$state.supervisor.lock")" != "600" ] \
            || [ "$(stat --format '%a' "$state.lock")" != "600" ] \
            || [ "$(stat --format '%a' "$state")" != "600" ] \
            || [ "$(stat --format '%a' "$workspace")" != "700" ] \
            || [ "$(stat --format '%a' "$control")" != "600" ]; then
            echo "recovered manager did not restore the exact exhaustion boundary"
            exit 1
          fi

      - name: Recover through promoted standby
        env:
          DATAGROUND_TEST_DATABASE_URL: ${{ env.DATAGROUND_ROUTED_DATABASE_URL }}
        run: >-
          go run ./cmd/dataground-enforcement-recovery-conformance
          --phase failover-recover
          --endpoint http://127.0.0.1:8333
          --bucket dataground-conformance
          --addressing-style path
          --run-id 223344556677889900aabbccddeeff11
          --allow-loopback-http

      - name: Fence stale former primary
        run: |
          target_lsn=$(docker compose -f deploy/storage/seaweedfs-conformance.yml exec -T postgres-standby \
            psql --username dataground --dbname dataground_conformance --tuples-only --no-align \
            --command 'SELECT pg_current_wal_flush_lsn()')
          if [[ ! "$target_lsn" =~ ^[0-9A-F]+/[0-9A-F]+$ ]]; then
            echo "could not establish the post-promotion WAL boundary"
            exit 1
          fi
          printf '%s\n' "$target_lsn" >"$RUNNER_TEMP/rejoin-target-lsn"
          docker compose -f deploy/storage/seaweedfs-conformance.yml \
            --profile postgres-failover-admin run --rm --no-deps postgres-fence

      - name: Refuse stale primary restart
        run: |
          docker compose -f deploy/storage/seaweedfs-conformance.yml \
            --profile postgres-failover start postgres
          primary_id=$(docker compose -f deploy/storage/seaweedfs-conformance.yml ps --all --quiet postgres)
          if [ -z "$primary_id" ]; then
            echo "fenced primary container was not found"
            exit 1
          fi
          for attempt in {1..10}; do
            running=$(docker inspect --format '{{.State.Running}}' "$primary_id")
            if [ "$running" = "false" ]; then
              break
            fi
            sleep 1
          done
          exit_code=$(docker inspect --format '{{.State.ExitCode}}' "$primary_id")
          if [ "$running" != "false" ] || [ "$exit_code" -ne 78 ] \
            || docker compose -f deploy/storage/seaweedfs-conformance.yml exec -T postgres \
              pg_isready --username dataground >/dev/null 2>&1; then
            echo "fenced stale primary accepted a restart"
            exit 1
          fi

      - name: Rewind and rejoin former primary
        run: |
          docker compose -f deploy/storage/seaweedfs-conformance.yml \
            --profile postgres-failover-admin run --rm --no-deps postgres-rejoin
          docker compose -f deploy/storage/seaweedfs-conformance.yml \
            --profile postgres-failover start postgres
          target_lsn=$(cat "$RUNNER_TEMP/rejoin-target-lsn")
          for attempt in {1..30}; do
            rejoined=$(docker compose -f deploy/storage/seaweedfs-conformance.yml exec -T postgres \
              psql --username dataground --dbname dataground_conformance --tuples-only --no-align \
              --command "SELECT pg_is_in_recovery()
                AND current_setting('transaction_read_only') = 'on'
                AND pg_last_wal_replay_lsn() >= '$target_lsn'::pg_lsn" 2>/dev/null || true)
            if [ "$rejoined" = "t" ]; then
              break
            fi
            sleep 1
          done
          promoted=$(docker compose -f deploy/storage/seaweedfs-conformance.yml exec -T postgres-standby \
            psql --username dataground --dbname dataground_conformance --tuples-only --no-align \
            --command "SELECT NOT pg_is_in_recovery()
              AND current_setting('transaction_read_only') = 'off'")
          if [ "$rejoined" != "t" ] || [ "$promoted" != "t" ]; then
            target_state=$(docker inspect --format '{{.State.Status}}' \
              "$(docker compose -f deploy/storage/seaweedfs-conformance.yml ps --all --quiet postgres)")
            replication_connections=$(docker compose -f deploy/storage/seaweedfs-conformance.yml \
              exec -T postgres-standby psql --username dataground --dbname dataground_conformance \
              --tuples-only --no-align --command \
              "SELECT count(*) FROM pg_stat_replication
                WHERE application_name = 'dataground-rejoined-primary'")
            sender_state=$(docker compose -f deploy/storage/seaweedfs-conformance.yml \
              exec -T postgres-standby psql --username dataground --dbname dataground_conformance \
              --tuples-only --no-align --command \
              "SELECT coalesce(max(state), 'none') FROM pg_stat_replication
                WHERE application_name = 'dataground-rejoined-primary'")
            target_probe=$(docker compose -f deploy/storage/seaweedfs-conformance.yml exec -T postgres \
              psql --username dataground --dbname dataground_conformance --tuples-only --no-align \
              --command "SELECT concat(
                'in-recovery=', pg_is_in_recovery(),
                ' read-only=', current_setting('transaction_read_only') = 'on',
                ' boundary-replayed=', coalesce(pg_last_wal_replay_lsn() >= '$target_lsn'::pg_lsn, false),
                ' replay-paused=', pg_is_wal_replay_paused()
              )" 2>/dev/null || printf '%s' 'unreachable')
            echo "rejoin check failed: target-state=$target_state replication-connections=$replication_connections sender-state=$sender_state target=$target_probe"
            exit 1
          fi
          if docker compose -f deploy/storage/seaweedfs-conformance.yml exec -T postgres \
            psql --username dataground --dbname dataground_conformance \
            --command 'CREATE TEMPORARY TABLE dataground_stale_write_probe (id integer)' \
            >/dev/null 2>&1; then
            echo "rejoined former primary accepted a write"
            exit 1
          fi
          docker compose -f deploy/storage/seaweedfs-conformance.yml exec -T postgres-standby \
            psql --username dataground --dbname dataground_conformance \
            --command 'CREATE TEMPORARY TABLE dataground_promoted_write_probe (id integer)' \
            >/dev/null

      - name: Observe catalog through rejoined standby
        env:
          DATAGROUND_TEST_DATABASE_URL: ${{ env.DATAGROUND_REJOINED_DATABASE_URL }}
        run: >-
          go run ./cmd/dataground-enforcement-recovery-conformance
          --phase failover-rejoin-observe
          --endpoint http://127.0.0.1:8333
          --bucket dataground-conformance
          --addressing-style path
          --run-id 223344556677889900aabbccddeeff11
          --allow-loopback-http

      - name: Recreate streaming pair for in-flight commit loss
        env:
          DATAGROUND_ROUTER_HEALTH_DATABASE_URL: postgres://dataground_health:dataground-health@127.0.0.1:55431/dataground_conformance?sslmode=disable
        run: |
          router="$RUNNER_TEMP/dataground-postgres-route-conformance"
          workspace="$RUNNER_TEMP/dataground-postgres-route"
          control="$workspace/control.sock"
          state="$workspace/state.json"
          kill "$(cat "$RUNNER_TEMP/postgres-route-manager.pid")"
          for attempt in {1..30}; do
            if ! kill -0 "$(cat "$RUNNER_TEMP/postgres-route-manager.pid")" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if kill -0 "$(cat "$RUNNER_TEMP/postgres-route-manager.pid")" 2>/dev/null \
            || [ -e "$control" ]; then
            echo "stable database endpoint did not stop cleanly before cluster recreation"
            exit 1
          fi
          docker compose -f deploy/storage/seaweedfs-conformance.yml \
            --profile postgres-failover down --volumes
          rm "$state"
          docker compose -f deploy/storage/seaweedfs-conformance.yml \
            --profile postgres-failover up --detach
          generation=""
          for attempt in {1..30}; do
            primary_ready=$(docker compose -f deploy/storage/seaweedfs-conformance.yml exec -T postgres \
              psql --username dataground --dbname dataground_conformance --tuples-only --no-align \
              --command 'SELECT NOT pg_is_in_recovery()' 2>/dev/null || true)
            standby_ready=$(docker compose -f deploy/storage/seaweedfs-conformance.yml exec -T postgres-standby \
              psql --username dataground --dbname dataground_conformance --tuples-only --no-align \
              --command 'SELECT pg_is_in_recovery()' 2>/dev/null || true)
            if curl --fail --silent http://127.0.0.1:8333/ >/dev/null \
              && [ "$primary_ready" = "t" ] && [ "$standby_ready" = "t" ]; then
              generation=$(docker compose -f deploy/storage/seaweedfs-conformance.yml exec -T postgres \
                psql --username dataground --dbname dataground_conformance --tuples-only --no-align \
                --command "SELECT (pg_split_walfile_name(pg_walfile_name(pg_current_wal_lsn()))).timeline_id")
              if [[ ! "$generation" =~ ^[1-9][0-9]*$ ]]; then
                echo "could not establish the recreated PostgreSQL promotion generation"
                exit 1
              fi
              printf '%s\n' "$generation" >"$RUNNER_TEMP/postgres-primary-generation"
              break
            fi
            sleep 1
          done
          if [[ ! "$generation" =~ ^[1-9][0-9]*$ ]]; then
            echo "recreated failover pair did not become ready"
            exit 1
          fi
          "$router" \
            --mode manage \
            --listen-address 127.0.0.1:55431 \
            --control-socket "$control" \
            --state-file "$state" \
            --primary-target 127.0.0.1:55432 \
            --promoted-target 127.0.0.1:55433 \
            --route primary \
            --promotion-generation "$generation" \
            >"$RUNNER_TEMP/postgres-route-manager.stdout" \
            2>"$RUNNER_TEMP/postgres-route-manager.stderr" &
          printf '%s\n' "$!" >"$RUNNER_TEMP/postgres-route-manager.pid"
          for attempt in {1..30}; do
            state_status=$("$router" --mode state --control-socket "$control" 2>/dev/null || true)
            routed_primary=$(DATAGROUND_TEST_DATABASE_URL="$DATAGROUND_ROUTED_DATABASE_URL" \
              "$router" --mode role 2>/dev/null || true)
            manager_state=$(cat "$RUNNER_TEMP/postgres-route-manager.stdout")
            if [ "$state_status" = "primary $generation" ] \
              && [ "$routed_primary" = "writable-primary" ] \
              && [ "$manager_state" = "supervisor-ready" ]; then
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/postgres-route-manager.pid")" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          echo "recreated stable database endpoint did not become ready"
          exit 1

      - name: Prepare in-flight failover scope on primary
        env:
          DATAGROUND_DATABASE_URL: ${{ env.DATAGROUND_ROUTED_DATABASE_URL }}
          DATAGROUND_TEST_DATABASE_URL: ${{ env.DATAGROUND_ROUTED_DATABASE_URL }}
        run: |
          go run ./cmd/dataground-migrate up
          go run ./cmd/dataground-enforcement-recovery-conformance \
            --phase prepare \
            --endpoint http://127.0.0.1:8333 \
            --bucket dataground-conformance \
            --addressing-style path \
            --run-id 3344556677889900aabbccddeeff1122 \
            --allow-loopback-http

      - name: Require standby replay through in-flight fixture
        run: |
          target_lsn=$(docker compose -f deploy/storage/seaweedfs-conformance.yml exec -T postgres \
            psql --username dataground --dbname dataground_conformance --tuples-only --no-align \
            --command 'SELECT pg_current_wal_lsn()')
          if [[ ! "$target_lsn" =~ ^[0-9A-F]+/[0-9A-F]+$ ]]; then
            echo "could not establish the in-flight fixture WAL boundary"
            exit 1
          fi
          for attempt in {1..30}; do
            replayed=$(docker compose -f deploy/storage/seaweedfs-conformance.yml exec -T postgres-standby \
              psql --username dataground --dbname dataground_conformance --tuples-only --no-align \
              --command "SELECT pg_last_wal_replay_lsn() >= '$target_lsn'::pg_lsn" 2>/dev/null || true)
            if [ "$replayed" = "t" ]; then
              exit 0
            fi
            sleep 1
          done
          echo "standby did not replay the in-flight fixture"
          exit 1

      - name: Lose primary while catalog commit is in flight
        env:
          DATAGROUND_TEST_DATABASE_URL: ${{ env.DATAGROUND_ROUTED_DATABASE_URL }}
        run: |
          runner="$RUNNER_TEMP/dataground-enforcement-recovery-conformance"
          signal="$RUNNER_TEMP/in-flight-commit.signal"
          report="$RUNNER_TEMP/in-flight-commit.json"
          stderr="$RUNNER_TEMP/in-flight-commit.stderr"
          go build -o "$runner" ./cmd/dataground-enforcement-recovery-conformance
          mkfifo "$signal"
          "$runner" \
            --phase failover-commit-loss \
            --primary-loss-signal-fd 3 \
            --endpoint http://127.0.0.1:8333 \
            --bucket dataground-conformance \
            --addressing-style path \
            --run-id 3344556677889900aabbccddeeff1122 \
            --allow-loopback-http >"$report" 2>"$stderr" 3>"$signal" &
          runner_pid=$!
          trap 'kill "$runner_pid" 2>/dev/null || true; rm -f "$signal"' EXIT
          state=""
          if ! IFS= read -r -t 30 state <"$signal" || [ "$state" != "commit-forwarded" ]; then
            kill "$runner_pid" 2>/dev/null || true
            wait "$runner_pid" 2>/dev/null || true
            echo "in-flight commit boundary was not reached"
            exit 1
          fi
          docker compose -f deploy/storage/seaweedfs-conformance.yml stop postgres
          set +e
          wait "$runner_pid"
          status=$?
          set -e
          trap - EXIT
          rm -f "$signal"
          if [ "$status" -ne 0 ] || [ -s "$stderr" ] \
            || ! grep --quiet '"phase": "failover-commit-loss"' "$report" \
            || ! grep --quiet '"status": "passed"' "$report"; then
            echo "in-flight primary-loss injection failed"
            exit 1
          fi

      - name: Promote standby after in-flight commit loss
        run: |
          if docker compose -f deploy/storage/seaweedfs-conformance.yml exec -T postgres-standby \
            pg_isready --host postgres --port 5432 --username dataground >/dev/null 2>&1; then
            echo "stopped primary remained reachable"
            exit 1
          fi
          docker compose -f deploy/storage/seaweedfs-conformance.yml exec -T postgres-standby \
            pg_ctl promote --pgdata /var/lib/postgresql/data/pgdata --wait
          promoted=$(docker compose -f deploy/storage/seaweedfs-conformance.yml exec -T postgres-standby \
            psql --username dataground --dbname dataground_conformance --tuples-only --no-align \
            --command 'SELECT NOT pg_is_in_recovery()')
          if [ "$promoted" != "t" ]; then
            echo "standby promotion after in-flight loss was not observed"
            exit 1
          fi
          initial_generation=$(cat "$RUNNER_TEMP/postgres-primary-generation")
          promoted_generation=$(docker compose -f deploy/storage/seaweedfs-conformance.yml \
            exec -T postgres-standby psql --username dataground \
            --dbname dataground_conformance --tuples-only --no-align \
            --command "SELECT (pg_split_walfile_name(pg_walfile_name(pg_current_wal_lsn()))).timeline_id")
          if [[ ! "$promoted_generation" =~ ^[1-9][0-9]*$ ]] \
            || (( promoted_generation <= initial_generation )); then
            echo "in-flight promotion did not advance the PostgreSQL promotion generation"
            exit 1
          fi
          if "$RUNNER_TEMP/dataground-postgres-route-conformance" \
            --mode select \
            --control-socket "$RUNNER_TEMP/dataground-postgres-route/control.sock" \
            --promotion-generation "$initial_generation" \
            >/dev/null 2>&1; then
            echo "stable database endpoint accepted a stale in-flight promotion generation"
            exit 1
          fi
          route=$("$RUNNER_TEMP/dataground-postgres-route-conformance" \
            --mode status \
            --control-socket "$RUNNER_TEMP/dataground-postgres-route/control.sock")
          if [ "$route" != "primary" ]; then
            echo "stale in-flight promotion generation changed the stable database route"
            exit 1
          fi
          selected=$("$RUNNER_TEMP/dataground-postgres-route-conformance" \
            --mode select \
            --control-socket "$RUNNER_TEMP/dataground-postgres-route/control.sock" \
            --promotion-generation "$promoted_generation")
          route=$("$RUNNER_TEMP/dataground-postgres-route-conformance" \
            --mode status \
            --control-socket "$RUNNER_TEMP/dataground-postgres-route/control.sock")
          routed_promoted=$(DATAGROUND_TEST_DATABASE_URL="$DATAGROUND_ROUTED_DATABASE_URL" \
            "$RUNNER_TEMP/dataground-postgres-route-conformance" --mode role \
            2>/dev/null || true)
          if [ "$selected" != "promoted" ] || [ "$route" != "promoted" ] \
            || [ "$routed_promoted" != "writable-primary" ]; then
            echo "stable database endpoint did not select the promoted node after in-flight loss"
            exit 1
          fi

      - name: Recover ambiguous commit through promoted standby
        env:
          DATAGROUND_TEST_DATABASE_URL: ${{ env.DATAGROUND_ROUTED_DATABASE_URL }}
        run: >-
          "$RUNNER_TEMP/dataground-enforcement-recovery-conformance"
          --phase failover-commit-recover
          --endpoint http://127.0.0.1:8333
          --bucket dataground-conformance
          --addressing-style path
          --run-id 3344556677889900aabbccddeeff1122
          --allow-loopback-http

      - name: Stop disposable failover backends
        if: always()
        run: |
          cleanup_status=0
          if [ -f "$RUNNER_TEMP/postgres-pool.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/postgres-pool.pid")" 2>/dev/null || true
            wait "$(cat "$RUNNER_TEMP/postgres-pool.pid")" 2>/dev/null || true
          fi
          if [ -s "$RUNNER_TEMP/postgres-pool.stderr" ]; then
            echo "long-lived database pool emitted unexpected error output"
            cleanup_status=1
          fi
          if [ -f "$RUNNER_TEMP/postgres-route-manager.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/postgres-route-manager.pid")" 2>/dev/null || true
            wait "$(cat "$RUNNER_TEMP/postgres-route-manager.pid")" 2>/dev/null || true
          fi
          if [ -s "$RUNNER_TEMP/postgres-route-manager.stderr" ] \
            || grep --invert-match --extended-regexp --quiet \
              '^(supervisor-ready|supervisor-restart-scheduled)$' \
              "$RUNNER_TEMP/postgres-route-manager.stdout"; then
            echo "stable database endpoint manager emitted unexpected output"
            cleanup_status=1
          fi
          expected_exhausted_states=$'supervisor-ready\nsupervisor-restart-scheduled\nsupervisor-ready\nsupervisor-restart-scheduled\nsupervisor-ready\nsupervisor-restart-scheduled\nsupervisor-ready'
          if [ -s "$RUNNER_TEMP/postgres-route-manager-replacement.stderr" ]; then
            if [ "$(cat "$RUNNER_TEMP/postgres-route-manager-replacement.stderr")" != \
                "PostgreSQL route manager failed" ] \
              || [ "$(cat "$RUNNER_TEMP/postgres-route-manager-replacement.stdout")" != \
                "$expected_exhausted_states" ]; then
              echo "replacement database endpoint manager emitted unexpected output"
              cleanup_status=1
            fi
          elif { [ -f "$RUNNER_TEMP/postgres-route-manager-replacement.stdout" ] \
            && grep --invert-match --extended-regexp --quiet \
              '^(supervisor-ready|supervisor-restart-scheduled)$' \
              "$RUNNER_TEMP/postgres-route-manager-replacement.stdout"; }; then
            echo "replacement database endpoint manager emitted unexpected output"
            cleanup_status=1
          fi
          if [ -s "$RUNNER_TEMP/postgres-route-manager-exhaustion-recovery.stderr" ] \
            || { [ -f "$RUNNER_TEMP/postgres-route-manager-exhaustion-recovery.stdout" ] \
              && grep --invert-match --extended-regexp --quiet \
                '^(supervisor-ready|supervisor-restart-scheduled)$' \
                "$RUNNER_TEMP/postgres-route-manager-exhaustion-recovery.stdout"; }; then
            echo "exhaustion recovery manager emitted unexpected output"
            cleanup_status=1
          fi
          docker compose -f deploy/storage/seaweedfs-conformance.yml \
            --profile postgres-failover down --volumes || cleanup_status=1
          exit "$cleanup_status"
