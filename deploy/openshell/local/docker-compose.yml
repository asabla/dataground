# Derived from OpenShell v0.1.9 deploy/docker under Apache-2.0.
# This is an ordinary local-development topology. It is not evidence-producing.
services:
  gateway:
    image: ghcr.io/nvidia/openshell/gateway@sha256:1fd9e1e807990e66c9486a28d3ce9d649fd7528df48d0e830d2de2148b52dfe5
    restart: unless-stopped
    command: ["--config", "/etc/openshell/gateway.toml"]
    user: "0"
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: /var/lib/openshell-dataground-v019
        target: /var/lib/openshell-dataground-v019
        bind:
          create_host_path: true
      - type: bind
        source: "${DATAGROUND_OPENSHELL_LOCAL_JWT_PATH:?required}"
        target: /run/dataground-local/gateway-jwt
        read_only: true
      - type: bind
        source: ./gateway.toml
        target: /etc/openshell/gateway.toml
        read_only: true
    environment:
      OPENSHELL_GATEWAY_CONFIG: /etc/openshell/gateway.toml
      OPENSHELL_DB_URL: "sqlite:/var/lib/openshell-dataground-v019/gateway.db?mode=rwc"
      XDG_DATA_HOME: /var/lib/openshell-dataground-v019
      XDG_STATE_HOME: /var/lib/openshell-dataground-v019
      HOME: /var/lib/openshell-dataground-v019
