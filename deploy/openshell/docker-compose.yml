# Derived from NVIDIA OpenShell v0.0.86 deploy/docker under Apache-2.0.
services:
  gateway:
    image: ghcr.io/nvidia/openshell/gateway@sha256:e21f520a0678ba3cfe749957338b5fa78c75e8e52de13e4559ccbb582f781a0b
    restart: unless-stopped
    command: []
    user: "0"
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: /var/lib/openshell
        target: /var/lib/openshell
        bind:
          create_host_path: true
      - type: bind
        source: ./gateway.toml
        target: /etc/openshell/gateway.toml
        read_only: true
    labels:
      dataground.dev/credential-evidence-run: "${DATAGROUND_CREDENTIAL_EVIDENCE_RUN_ID:-}"
      dataground.dev/credential-evidence-gateway: "${DATAGROUND_CREDENTIAL_EVIDENCE_GATEWAY:-}"
      dataground.dev/credential-evidence-provider: "${DATAGROUND_CREDENTIAL_EVIDENCE_PROVIDER:-}"
    environment:
      OPENSHELL_GATEWAY_CONFIG: /etc/openshell/gateway.toml
      OPENSHELL_DB_URL: "sqlite:/var/lib/openshell/gateway.db?mode=rwc"
      XDG_DATA_HOME: /var/lib/openshell
      HOME: /var/lib/openshell
