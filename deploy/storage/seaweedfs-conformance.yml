name: dataground-s3-conformance

services:
  seaweedfs:
    image: chrislusf/seaweedfs@sha256:52194fba4fecd0083c842158b3a902ba6e04a63619b2b0efcd08007bdb6a4602
    command:
      - mini
      - -dir=/data
    environment:
      S3_BUCKET: dataground-conformance
    ports:
      - "127.0.0.1:8333:8333"
    tmpfs:
      - /data:size=256m,mode=0700
    mem_limit: 512m
    pids_limit: 256
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    init: true

  postgres:
    image: postgres:18.4-bookworm
    user: "999:999"
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_DB: dataground_conformance
      POSTGRES_PASSWORD: dataground
      POSTGRES_USER: dataground
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-conformance-data:/var/lib/postgresql
    mem_limit: 512m
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true

volumes:
  postgres-conformance-data:
