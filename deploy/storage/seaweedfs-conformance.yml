name: dataground-s3-conformance

services:
  seaweedfs:
    image: chrislusf/seaweedfs@sha256:52194fba4fecd0083c842158b3a902ba6e04a63619b2b0efcd08007bdb6a4602
    command:
      - mini
      - -dir=/data
    environment:
      S3_BUCKET: dataground-conformance
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweedfs-conformance-data:/data
    mem_limit: 512m
    pids_limit: 256
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    init: true

  postgres:
    image: postgres:18.4-bookworm
    user: "999:999"
    environment:
      DATAGROUND_FENCE_PATH: /var/lib/postgresql/.dataground-fenced
      PGPASSFILE: /var/lib/postgresql/.dataground-replication-pass
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_DB: dataground_conformance
      POSTGRES_PASSWORD: dataground
      POSTGRES_USER: dataground
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-conformance-data:/var/lib/postgresql
      - ./postgres-primary-init.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
      - ./postgres-primary-entrypoint.sh:/opt/dataground/postgres-primary-entrypoint.sh:ro
    entrypoint:
      - /opt/dataground/postgres-primary-entrypoint.sh
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=4
      - -c
      - max_replication_slots=4
      - -c
      - wal_keep_size=64MB
      - -c
      - wal_log_hints=on
    mem_limit: 512m
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true

  postgres-standby:
    profiles:
      - postgres-failover
    image: postgres:18.4-bookworm
    user: "999:999"
    depends_on:
      - postgres
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_PASSWORD: dataground
      POSTGRES_USER: dataground
    entrypoint:
      - /opt/dataground/postgres-standby-entrypoint.sh
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - postgres-standby-conformance-data:/var/lib/postgresql
      - ./postgres-standby-entrypoint.sh:/opt/dataground/postgres-standby-entrypoint.sh:ro
    mem_limit: 512m
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true

  postgres-fence:
    profiles:
      - postgres-failover-admin
    image: postgres:18.4-bookworm
    user: "999:999"
    environment:
      DATAGROUND_FENCE_PATH: /var/lib/postgresql/.dataground-fenced
      PGDATA: /var/lib/postgresql/data/pgdata
    entrypoint:
      - /opt/dataground/postgres-fence.sh
    volumes:
      - postgres-conformance-data:/var/lib/postgresql
      - ./postgres-fence.sh:/opt/dataground/postgres-fence.sh:ro
    mem_limit: 128m
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  postgres-rejoin:
    profiles:
      - postgres-failover-admin
    image: postgres:18.4-bookworm
    user: "999:999"
    environment:
      DATAGROUND_FENCE_PATH: /var/lib/postgresql/.dataground-fenced
      DATAGROUND_REPLICATION_PASSFILE: /var/lib/postgresql/.dataground-replication-pass
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_PASSWORD: dataground
      POSTGRES_USER: dataground
    entrypoint:
      - /opt/dataground/postgres-rejoin.sh
    volumes:
      - postgres-conformance-data:/var/lib/postgresql
      - ./postgres-rejoin.sh:/opt/dataground/postgres-rejoin.sh:ro
    mem_limit: 256m
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  seaweedfs-conformance-data:
  postgres-conformance-data:
  postgres-standby-conformance-data:
