<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">DataGround workbench in the Night Operations theme</title>
  <desc id="description">The workbench shell shows bootstrap status and its expanded implementation contract.</desc>
  <rect width="1440" height="900" fill="#080d16"/>
  <g font-family="DejaVu Sans, sans-serif">
    <text x="208" y="118" fill="#6f7d90" font-size="13" font-weight="700" letter-spacing="2">DATAGROUND WORKBENCH</text>
    <text x="208" y="206" fill="#e6edf5" font-size="72" font-weight="700" letter-spacing="-4">Governed work, grounded.</text>

    <rect x="208" y="274" width="1024" height="286" rx="8" fill="#0d1420" stroke="#263244" stroke-width="1"/>
    <rect x="256" y="330" width="150" height="28" rx="14" fill="#053449" stroke="#3ba7d8"/>
    <circle cx="274" cy="344" r="4" fill="none" stroke="#3ba7d8" stroke-width="2"/>
    <text x="289" y="349" fill="#3ba7d8" font-size="11" font-weight="600">Bootstrap status</text>
    <text x="256" y="420" fill="#e6edf5" font-size="38" font-weight="700" letter-spacing="-1">Project foundation</text>
    <text x="256" y="465" fill="#e6edf5" font-size="38" font-weight="700" letter-spacing="-1">ready</text>

    <text x="780" y="340" fill="#9ba8b8" font-size="16">
      <tspan x="780" dy="0">The workbench shell is running. Product</tspan>
      <tspan x="780" dy="26">resources remain unavailable until their versioned</tspan>
      <tspan x="780" dy="26">contracts and authorization behavior are implemented.</tspan>
    </text>
    <rect x="780" y="452" width="248" height="36" rx="8" fill="transparent" stroke="transparent"/>
    <text x="796" y="475" fill="#3ba7d8" font-size="14" font-weight="500">Hide implementation contract</text>

    <rect x="208" y="600" width="1024" height="188" rx="8" fill="#121c2a" stroke="#263244"/>
    <rect x="208" y="600" width="2" height="188" fill="#3ba7d8"/>
    <text x="248" y="660" fill="#e6edf5" font-size="24" font-weight="700">Workbench implementation contract</text>
    <text x="248" y="710" fill="#9ba8b8" font-size="16">
      <tspan x="248" dy="0">Shared tokens and accessible primitives are active. Product modules remain responsible for</tspan>
      <tspan x="248" dy="26">authorization, data loading, commands, and durable resource state.</tspan>
    </text>
    <text x="1208" y="852" fill="#6f7d90" font-family="ui-monospace, monospace" font-size="11" font-weight="600" text-anchor="end">NIGHT / COMPACT</text>
  </g>
</svg>
