[project]
name = "dataground-development"
version = "0.0.0"
requires-python = ">=3.11"

[dependency-groups]
dev = ["ruff==0.17.6", "ty==0.0.107"]

[tool.ruff]
include = ["*.py", "*.pyi", "pyproject.toml"]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ty.environment]
python-version = "3.11"
